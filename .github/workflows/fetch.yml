name: Drive fetch (temporary)
on:
  push:
    branches: [drive-fetch]
    paths: [ids.txt]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, '[got]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install gdown
          mkdir -p got
          while read id; do [ -n "$id" ] && gdown --quiet "$id" -O "got/$id.jpg" || echo "FAIL $id" >> got/fail.txt; done < ids.txt
          ls -la got > got/list.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add got; git commit -m "files [got]"; git push
