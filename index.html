<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phuket King</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: a fixed side list of sections and one working column of tables and forms; on a phone the sections become a scrolling strip. */
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --sunken:#E9E6DB; --ink:#101311; --muted:#5A605B; --line:#D9D5C8;
  --gold:#B88A44; --gold-ink:#7A5720; --btn-bg:#101311; --btn-fg:#F2EFE7;
  --ok:#1F6B4A; --warn:#7D5200; --bad:#A3312A; --ok-bg:#DDEFE5; --warn-bg:#F6E7C4; --bad-bg:#F6DCD8;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101311; --surface:#1A1E1B; --sunken:#151916; --ink:#F2EFE7; --muted:#A9AEA8; --line:#2E3430;
  --gold:#B88A44; --gold-ink:#CFA35C; --btn-bg:#B88A44; --btn-fg:#101311;
  --ok:#8FD1AE; --warn:#E3BE7E; --bad:#F0A19A; --ok-bg:#16332A; --warn-bg:#3A2E14; --bad-bg:#3F1F1C; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101311; --surface:#1A1E1B; --sunken:#151916; --ink:#F2EFE7; --muted:#A9AEA8; --line:#2E3430;
  --gold:#B88A44; --gold-ink:#CFA35C; --btn-bg:#B88A44; --btn-fg:#101311;
  --ok:#8FD1AE; --warn:#E3BE7E; --bad:#F0A19A; --ok-bg:#16332A; --warn-bg:#3A2E14; --bad-bg:#3F1F1C; color-scheme:dark }
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.app{display:flex;min-height:100%}
.side{width:212px;flex:none;background:var(--sunken);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.b1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.1em;color:var(--gold-ink);white-space:nowrap}
.b2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{appearance:none;border:0;background:transparent;color:var(--ink);font:500 15px var(--body);text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px;white-space:nowrap}
#nav button:hover{background:var(--surface)}
#nav button[aria-current="page"]{background:var(--surface);font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.who{margin:auto 8px 0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.who b{color:var(--ink)}
.login{max-width:420px;display:flex;flex-direction:column;gap:14px}
.tabs2{display:flex;gap:4px;padding:4px;background:var(--sunken);border-radius:10px}
.tabs2 button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);min-height:40px;border-radius:8px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.login input{width:100%}
main{flex:1;min-width:0;padding-block:24px;padding-inline:24px}
#view{max-width:1080px;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.sec{display:flex;flex-direction:column;gap:10px}
.sechead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.scroll{overflow-x:auto}
.cards{max-width:640px}
.card{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.card:last-child{border-bottom:0}
.ctop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.cwhen{font-weight:600;font-variant-numeric:tabular-nums}
.cright{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.cnote{color:var(--muted);font-size:14px}
.done{max-width:640px;border-color:var(--ok);background:var(--ok-bg);display:flex;flex-direction:column;gap:6px}
.donebig{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;color:var(--ok)}
.donewhat{font-size:18px;font-weight:600}
.checkin{max-width:640px}
.checkin .hit:first-of-type{border-top:0}
.narrow{max-width:640px}
.poster{max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.poster .p1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.1em;color:var(--gold-ink)}
.poster .p2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase}
.poster ol{margin:0;padding-left:20px;text-align:left;font-size:14px;color:var(--muted)}
.qr{width:220px;background:#fff;padding:8px;border-radius:8px}
.qr svg{display:block;width:100%;height:auto}
@media print{
  body.print-poster{background:#fff}
  body.print-poster .side,body.print-poster #banner,body.print-poster #toast,body.print-poster .noprint,body.print-poster #view>*:not(.posterwrap){display:none!important}
  body.print-poster main{padding:0}
  body.print-poster #view{max-width:none}
  body.print-poster .poster{max-width:none;border:0;background:#fff;color:#000;gap:8mm;padding-top:20mm}
  body.print-poster .poster .p1{font-size:16mm;color:#000}
  body.print-poster .poster .p2{font-size:22mm}
  body.print-poster .poster ol{font-size:7mm;color:#000}
  body.print-poster .qr{width:120mm;padding:0}
}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-top:1px solid var(--line)}
.empty{padding:22px 16px;color:var(--muted);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:0 14px;min-height:40px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.small{min-height:34px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{appearance:none;border:0;background:none;padding:0;font:600 14px var(--body);color:var(--gold-ink);cursor:pointer;text-align:left;white-space:nowrap}
.link:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:20px;font-size:14px;color:var(--muted)}
.stats b{font-family:var(--display);font-size:24px;font-weight:600;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
input,select,textarea{font:400 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
textarea{width:100%;resize:vertical}
.search{flex:1 1 220px;min-width:0}
.hit{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.hit .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.hit .who small{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px 20px}
.kv div{min-width:0}
.kv small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#banner{max-width:1080px;margin-bottom:16px;padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog h2{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field small{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%}
.check{display:flex;align-items:center;gap:10px;font-size:14px;min-height:40px;cursor:pointer}
.check input{min-height:0;width:18px;height:18px;accent-color:var(--gold)}
fieldset.field{border:0;padding:0;margin:0;min-width:0}
fieldset.field legend{font-size:13px;font-weight:600;padding:0;margin-bottom:2px}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 12px}
.checkgrid .check{min-height:36px}
.wrap{display:inline-block;min-width:180px}
.ferr{margin:0;color:var(--bad);font-size:14px}
.factions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:5}
ul.plain{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
@media (max-width:760px){
  .app{flex-direction:column}
  .side{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0}
  #nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  #nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--gold)}
  .who{margin:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  main{padding-block:16px;padding-inline:16px}
  h1{font-size:28px}
  .scroll table{min-width:620px}
}
@media (prefers-reduced-motion:no-preference){ .btn,#nav button{transition:background-color .12s,border-color .12s} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="b1">PHUKET KING</span><span class="b2" id="mode">Back office</span></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <div id="banner" hidden></div>
    <div id="view"><div class="panel empty">Loading. The sign in screen will appear here.</div></div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';
/*LOGIC-START*/
function ymd(d){ var p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseYmd(s){ var a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function weekStart(s){ var d=parseYmd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function classesLeft(p){ return p.class_limit ? (p.classes_left==null ? p.class_limit : p.classes_left) : null; }
function purchaseState(p,today,usedThisWeek){
  if(p.cancelled) return {ok:false,status:'cancelled',label:'Cancelled'};
  if(p.class_limit && classesLeft(p)<=0) return {ok:false,status:'used_up',label:'All visits used'};
  if(!p.starts_on){
    if(p.start_by && today>p.start_by) return {ok:false,status:'start_missed',label:'Start deadline passed'};
    return {ok:true,status:'not_started',label:'Not started'};
  }
  if(p.expires_on && today>p.expires_on) return {ok:false,status:'expired',label:'Expired'};
  if(p.per_week_limit && usedThisWeek>=p.per_week_limit) return {ok:false,status:'week_limit',label:'Weekly limit reached'};
  return {ok:true,status:'active',label:'Active'};
}
function startPurchase(p,day){ var o={starts_on:day}; if(p.duration_days) o.expires_on=addDays(day,p.duration_days-1); return o; }
function coachShare(price,pct){ return Math.round((Number(price)||0)*(pct==null?50:Number(pct))/100); }
var FACILITIES=['Fitness zone','Open gym','Spa'];
function coverReason(p,target){
  if(p.covers==null) return null;
  if(target.kind==='facility') return p.covers.indexOf(target.name)>=0?null:'does not include '+target.name;
  if(p.covers.indexOf(target.discipline)<0) return 'does not include '+target.discipline+' classes';
  if(p.times&&p.times.length&&p.times.indexOf(target.time)<0) return 'only covers the '+p.times.join(' and ')+' classes';
  return null;
}
function coversClasses(p){ if(p.covers==null) return true; return p.covers.some(function(c){return FACILITIES.indexOf(c)<0&&c!=='Privates';}); }
function countsVisit(p,target){ return target.kind==='class'||!coversClasses(p); }
function canCheckIn(p,st,target,classToday){
  var r=coverReason(p,target); if(r) return {ok:false,reason:r};
  if(st.ok) return {ok:true};
  if(!countsVisit(p,target)&&(st.status==='used_up'||st.status==='week_limit')&&classToday) return {ok:true};
  return {ok:false,reason:'('+st.label.toLowerCase()+')'};
}
function shiftTime(t,mins){ var a=t.split(':').map(Number), m=Math.max(0,Math.min(1439,a[0]*60+a[1]+mins)); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function priceFor(pk,group){
  var std=pk.price_thb, loc=pk.price_local_thb, thai=pk.price_thai_thb;
  if(group==='thai') return thai!=null?thai:(loc!=null?loc:std);
  if(group==='local') return loc!=null?loc:std;
  return std;
}
function canBuy(pk,group){ var a=pk.audience||'all'; return a==='all'||(a==='local'&&(group==='local'||group==='thai'))||(a==='thai'&&group==='thai'); }
function addonFor(pk,group){ return (group!=='standard'&&pk.addon_fz_local_thb!=null)?pk.addon_fz_local_thb:(pk.addon_fz_thb==null?null:pk.addon_fz_thb); }
function isPrivatePack(p){ return !!(p.covers&&p.covers.indexOf('Privates')>=0&&p.class_limit); }
function perSession(p){ return p.class_limit?Math.round((Number(p.price_thb)||0)/p.class_limit):null; }
function srcPrice(s,group){ return (group!=='standard'&&s.price_local_thb!=null)?s.price_local_thb:s.price_thb; }
function moveNeedsCoach(privateDate,today){ return today>=privateDate; }
function moveReady(r){ return r.by==='coach'||!r.needs_coach||!!r.coach_agreed; }
/*LOGIC-END*/

var COLS=['packages','staff','customers','purchases','classes','checkin_days','privates','sources','holidays'];
var S={}; COLS.forEach(function(c){S[c]=[];});
var db=null, ready={}, allReady=false;
var ALLTABS=[['today','Today'],['customers','Customers'],['packages','Packages'],['timetable','Timetable'],['privates','Privates'],['staff','Staff'],['commission','Commission'],['coach','Coach view'],['settings','Settings']];
var TABS=[];
var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var DISCIPLINES=['Muay Thai','Striking','MMA','Self-defence','Fitness','Yoga','Kids'];
var TIERS={train:'Train',progress:'Progress',pangea:'Pangea'};
var GROUPS={standard:'Standard',local:'Local resident',thai:'Thai'};
var ROLES={manager:'Manager',front_desk:'Front desk',coach:'Coach'};
var PSTATUS={requested:'Requested',confirmed:'Confirmed',done:'Done',cancelled:'Cancelled'};
var ui={tab:'today',q:'',cq:'',customerId:null,target:'',targetAuto:true,pfilter:'upcoming',coachId:'',month:ymd(new Date()).slice(0,7)};
var $view=document.getElementById('view'), $nav=document.getElementById('nav'), $dlg=document.getElementById('dlg'), $toast=document.getElementById('toast'), $banner=document.getElementById('banner'), $who=document.getElementById('who');

function h(tag,attrs){
  var el=document.createElement(tag), k, v;
  if(attrs) for(k in attrs){ v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v; else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v); else el.setAttribute(k,v===true?'':v); }
  var kids=Array.prototype.slice.call(arguments,2);
  (function add(list){ list.forEach(function(kid){ if(kid==null||kid===false) return; if(Array.isArray(kid)) return add(kid); el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }); })(kids);
  return el;
}
function byId(col,id){ for(var i=0;i<S[col].length;i++) if(S[col][i].id===id) return S[col][i]; return null; }
function nameOf(col,id,fallback){ var d=byId(col,id); return d&&d.name?d.name:(fallback||'Removed'); }
function sortBy(list){ var keys=Array.prototype.slice.call(arguments,1); return list.slice().sort(function(a,b){ for(var i=0;i<keys.length;i++){ var x=String(a[keys[i]]==null?'':a[keys[i]]).toLowerCase(), y=String(b[keys[i]]==null?'':b[keys[i]]).toLowerCase(); if(x<y) return -1; if(x>y) return 1; } return 0; }); }
function thb(n){ return n==null||n===''?'':Number(n).toLocaleString('en-US')+' THB'; }
function fmtDate(s){ if(!s) return ''; return parseYmd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function timeNow(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function errText(e){ return e&&e.code==='quota_exceeded' ? 'The test database is full. Delete some old records first.' : 'That did not save. '+((e&&e.message)||'Try again.'); }
var toastTimer=0;
function toast(msg){ $toast.textContent=msg; $toast.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(function(){$toast.hidden=true;},3200); }
function chip(text,kind){ return h('span',{class:'chip'+(kind?' '+kind:'')},text); }
function exChip(d){ return d&&d.example?[' ',chip('Example')]:null; }
function btn(label,onclick,cls){ return h('button',{type:'button',class:'btn'+(cls?' '+cls:''),onclick:onclick},label); }
function linkBtn(label,onclick){ return h('button',{type:'button',class:'link',onclick:onclick},label); }
function guard(){ if(!db){ toast('Sign in first.'); return false; } return true; }
function run(promise,okMsg){ promise.then(function(){ if(okMsg) toast(okMsg); },function(e){ toast(errText(e)); }); }
function save(col,id,data){ var body=Object.assign({},data); delete body.id; return id ? db.doc(col+'/'+id).set(body) : db.collection(col).add(body); }

function table(cols,rows,emptyMsg,foot){
  if(!rows.length) return h('div',{class:'panel empty'},emptyMsg);
  return h('div',{class:'panel scroll'},h('table',null,
    h('thead',null,h('tr',null,cols.map(function(c){return h('th',{class:c.num?'num':null,scope:'col'},c.label);}))),
    h('tbody',null,rows.map(function(r){ return h('tr',null,cols.map(function(c){ return h('td',{class:c.num?'num':null},c.cell(r)); })); })),
    foot?h('tfoot',null,h('tr',null,foot.map(function(f,i){return h('td',{class:cols[i].num?'num':null},f);}))):null));
}
function section(title,action,body){ return h('section',{class:'sec'},h('div',{class:'sechead'},h('h2',null,title),action||null),body); }
function pageHead(title,sub,action){ return h('div',{class:'head'},h('div',null,h('h1',null,title),sub?h('p',{class:'sub'},sub):null),action||null); }

/* ---------- forms ---------- */
function openForm(spec){
  if(!guard()) return;
  var vals=spec.values||{}, inputs={}, armed=false;
  var err=h('p',{class:'ferr',role:'alert',hidden:true});

function pkgDays(n){
  if(n===1) return '1 day';
  if(n<28&&n%7===0) return n/7===1?'1 week':(n/7)+' weeks';
  var m=Math.round(n/30.4); if(n>=28&&Math.abs(n-m*30.4)<=4) return m===1?'1 month':m+' months';
  return n+' days';
}

  if(k.duration_days) b.push('valid '+pkgDays(k.duration_days)+(k.clock==='purchase'?' from the day you pay':' from your first visit'));
  if(k.start_within_days) b.push('start within '+pkgDays(k.start_within_days));

function authText(e){
  var m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m)) return 'Email or password is wrong. If you have only ever signed in with an email link, tap Forgot password to set one.';
  if(/email not confirmed/i.test(m)) return 'Confirm your email first. Open the link we sent when you made your account.';
  if(/rate limit|too many/i.test(m)) return 'Too many tries. Wait a few minutes and try again.';
  if(/should be at least|weak/i.test(m)) return 'That password is too short or too easy to guess. Use at least 8 characters.';
  if(/same as the old|different from the old/i.test(m)) return 'That is already your password.';
  return m||'Something went wrong. Try again.';
}
var signMode='in', recovering=false;
function showSignIn(){

  var go=h('button',{type:'submit',class:'btn primary'},mode==='up'?'Create account':mode==='link'?'Email me a sign in link':mode==='reset'?'Email me a reset link':'Sign in');

  var form=h('form',{class:'panel pad login',novalidate:true},h('h1',null,mode==='up'?'Create account':mode==='reset'?'Reset password':'Sign in'),
