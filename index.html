<script>
(function(){
'use strict';
/*LOGIC-START*/
function ymd(d){ var p=function(n){return String(n).padStart(2,'0');}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

  if(p.stay_id&&p.expires_on===today) return {ok:true,status:'active',label:'Leaving day, morning class only'};
  if(!p.starts_on){
    if(p.start_by && today>p.start_by) return {ok:false,status:'start_missed',label:'Start deadline passed'};
    return {ok:true,status:'not_started',label:'Not started'};

function priceFor(pk,group){
  var std=pk.price_thb, loc=pk.price_local_thb, thai=pk.price_thai_thb;
  if(group==='thai') return thai!=null?thai:(loc!=null?loc:std);
  if(group==='local') return loc!=null?loc:std;
  return std;
}
function hasTiers(t){ return Array.isArray(t)&&t.length>0; }
function tiersFor(pk,group){ return (group==='local'||group==='thai')&&hasTiers(pk.tiers_local)?pk.tiers_local:(hasTiers(pk.tiers)?pk.tiers:null); }
function tierUnit(t,q){ var u=null; (t||[]).slice().sort(function(a,b){return a.from-b.from;}).forEach(function(x){ if(x.from<=q) u=x.price; }); return u; }
function tiersText(t){ return hasTiers(t)?t.slice().sort(function(a,b){return a.from-b.from;}).map(function(x){ return x.from+':'+x.price; }).join(', '):''; }
function parseTiers(str){ str=String(str||'').trim(); if(!str) return null; var out=[], bad=false;
  str.split(/[,;\n]+/).forEach(function(part){ part=part.trim(); if(!part) return; var m=part.match(/^(\d+)\s*\+?\s*(?:-\s*\d+\s*)?[:=]\s*(\d+)$/); if(!m){ bad=true; return; } out.push({from:Number(m[1]),price:Number(m[2])}); });
  if(bad||!out.length) throw new Error('Write the prices like 1:900, 5:800, 10:700, 20:650. The first number is how many, the second is the price for each one.');
  out.sort(function(a,b){return a.from-b.from;}); if(out[0].from!==1) throw new Error('The price list must start at 1, like 1:900.');

var CU=null, cuCode=null, cuAt=0, cuDone=null, cuBusy=false;
var CTABS=[['c_home','Home'],['c_food','Food'],['c_classes','Timetable'],['c_buy','Packages'],['c_pt','Privates']];
(function(){

    else { var st=JSON.parse(localStorage.getItem('pk_code')||'null'); if(st&&st.c){ cuCode=st.c; cuAt=Number(st.t)||0; } }
  }catch(e){}
})();
function liveCode(){ return cuCode&&Date.now()-cuAt<20*60000?cuCode:null; }
function forgetCode(){ cuCode=null; try{ localStorage.removeItem('pk_code'); }catch(e){} }
function setCode(c){ cuCode=c; cuAt=Date.now(); cuDone=null; try{ localStorage.setItem('pk_code',JSON.stringify({c:c,t:cuAt})); }catch(e){} }
/* in-app scanner: an installed app on iPhone cannot be opened by the camera, so members scan the poster from inside the app */
var JSQR_URL='vendor/jsqr-1.4.0.js';
function loadJsQR(){
  if(window.jsQR) return Promise.resolve();
  return new Promise(function(ok,bad){ var sc=document.createElement('script'); sc.src=JSQR_URL; sc.onload=ok; sc.onerror=function(){ bad(new Error('load')); }; document.head.appendChild(sc); });
}
function codeFromText(t){
  try{ var u=new URL(String(t)); var c=u.searchParams.get('c'); return c&&/^[a-zA-Z0-9]{6,64}$/.test(c)?c:null; }catch(e){ return null; }
}
function scanCheckIn(){
  scanQR('Point your camera at the QR code at the front desk.',function(text){
    var c=codeFromText(text); if(!c) return 'That is not the Phuket King check in code. Try the poster at the front desk.';
    setCode(c); go('c_home'); toast('Code scanned. Tap your class.'); return true; });
}
function scanQR(prompt,onText){
  var stream=null, timer=null, done=false, detector=null;
  var video=h('video',{playsinline:'',muted:'',autoplay:''}); video.muted=true; video.setAttribute('playsinline','');
  var msg=h('p',{class:'scanmsg'},prompt);
  var box=h('div',{class:'scanbox'},h('div',{class:'scanview'},video,h('div',{class:'scanframe'})),msg,
    btn('Cancel',function(){ stop(); },'small'));
  var wrap=h('div',{class:'scanwrap'},box); document.body.appendChild(wrap);
  var canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
  function stop(){ done=true; clearTimeout(timer); if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); if(wrap.parentNode) wrap.parentNode.removeChild(wrap); }
  function found(text){
    var r=onText(text);
    if(r!==true){ msg.textContent=r||'That QR code is not the right one.'; return false; }
    stop(); return true;
  }
  function tick(){
    if(done) return;
    if(video.readyState>=2&&video.videoWidth){
      if(detector){
        detector.detect(video).then(function(r){ if(!done&&!(r&&r.length&&found(r[0].rawValue))) timer=setTimeout(tick,250); },function(){ detector=null; timer=setTimeout(tick,250); });
        return;
      }
      if(window.jsQR){
        var w=Math.min(640,video.videoWidth), hh=Math.round(video.videoHeight*w/video.videoWidth);
        canvas.width=w; canvas.height=hh; ctx.drawImage(video,0,0,w,hh);
        var q=window.jsQR(ctx.getImageData(0,0,w,hh).data,w,hh,{inversionAttempts:'dontInvert'});
        if(q&&q.data&&found(q.data)) return;
      } else if(!detector) { loadJsQR().catch(function(){}); }
    }
    timer=setTimeout(tick,200);
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ msg.textContent='This phone cannot open the camera here. Use your normal camera app to scan the poster.'; return; }
  try{ if('BarcodeDetector' in window) detector=new window.BarcodeDetector({formats:['qr_code']}); }catch(e){ detector=null; }
  (detector?Promise.resolve():loadJsQR()).then(function(){
    return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }).then(function(st){
    if(done){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
    stream=st; video.srcObject=st; var pl=video.play(); if(pl&&pl.catch) pl.catch(function(){}); tick();
  }).catch(function(e){
    msg.textContent=e&&e.name==='NotAllowedError'?'Camera blocked. Allow the camera for this app in your phone settings, then try again.':
      e&&e.message==='load'?'Could not load the scanner. Check your connection and try again.':'Could not open the camera. Use your normal camera app to scan the poster.';
  });
}

  var crios=/CriOS/.test(ua), fxios=/FxiOS/.test(ua), edgios=/EdgiOS/.test(ua), samsung=/SamsungBrowser/i.test(ua);
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  var deferred=null, bar=null, sheet=null;
  var appUrl=location.origin+location.pathname;
  /* LINE opens this link in the phone's real browser */
  if(line&&!/openExternalBrowser=1/.test(location.search)&&!sessionStorageGet('pk_ext')){ sessionStorageSet('pk_ext','1'); location.replace(appUrl+(location.search?location.search+'&':'?')+'openExternalBrowser=1'+location.hash); return; }
  function sessionStorageGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function sessionStorageSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
  function hidden(){ try{ var t=Number(localStorage.getItem('pk_install_hide')||0); return t&&Date.now()<t; }catch(e){ return false; } }
  function hideFor(days){ try{ localStorage.setItem('pk_install_hide',String(Date.now()+days*86400000)); }catch(e){} if(bar){ bar.remove(); bar=null; } document.body.classList.remove('has-install'); }
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  var ICON={
    share:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
    add:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    dots:'<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
    more:'<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    ok:'<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>'};
  function step(icon,en,th){ var r=el('li','istep'), i=el('span','isicon'); i.innerHTML=ICON[icon]; var t=el('div','istxt'); t.appendChild(el('b',null,en)); if(th) t.appendChild(el('span',null,th)); r.appendChild(i); r.appendChild(t); return r; }
  function copyLink(btnEl){ var done=function(){ btnEl.textContent='Link copied'; }; try{ navigator.clipboard.writeText(appUrl).then(done,function(){ prompt('Copy this link',appUrl); }); }catch(e){ prompt('Copy this link',appUrl); } }
  function closeSheet(){ if(sheet){ sheet.remove(); sheet=null; document.body.classList.remove('isheet-open'); } }
  function open(){
    if(deferred){ var d=deferred; deferred=null; d.prompt(); (d.userChoice||Promise.resolve({})).then(function(r){ if(r&&r.outcome==='accepted') hideFor(3650); }); return; }
    closeSheet();
    sheet=el('div','isheet'); sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true'); sheet.setAttribute('aria-label','Put the app on your phone');
    var box=el('div','isbox'), head=el('div','ishead'), img=el('img','installicon'); img.src='icons/icon-192.png'; img.alt='';
    var ht=el('div','installtxt'); ht.appendChild(el('b',null,'Put Phuket King on your phone')); ht.appendChild(el('span',null,'วางแอป Phuket King ไว้บนหน้าจอโทรศัพท์'));
    var x=el('button','installx','×'); x.type='button'; x.setAttribute('aria-label','Close'); x.onclick=closeSheet;

    var ol=el('ol','isteps'), acts=el('div','isacts');

    else if(inApp&&android){
      ol.appendChild(step('dots','This chat app can not install apps. Open it in Chrome first.','แอปแชทนี้ติดตั้งไม่ได้ เปิดใน Chrome ก่อน'));
      var go=el('button','btn primary','Open in Chrome'); go.type='button';
      go.onclick=function(){ location.href='intent://'+appUrl.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(appUrl)+';end'; };
      acts.appendChild(go);
      ol.appendChild(step('add','Then tap Install app.','แล้วแตะ ติดตั้งแอป'));
    } else if(inApp&&ios){
      ol.appendChild(step('more','This chat app can not install apps. Tap ⋯ or the compass icon and choose "Open in Safari".','แอปแชทนี้ติดตั้งไม่ได้ แตะ ⋯ แล้วเลือก เปิดใน Safari'));
      ol.appendChild(step('share','No such button? Copy the link, open Safari and paste it.','ถ้าไม่มีปุ่มนี้ คัดลอกลิงก์ เปิด Safari แล้ววาง'));
      var cp=el('button','btn primary','Copy the link'); cp.type='button'; cp.onclick=function(){ copyLink(cp); }; acts.appendChild(cp);
    } else if(ios){
      if(crios||edgios||fxios) ol.appendChild(step('share','Tap the Share button at the top, next to the address.','แตะปุ่ม แชร์ ด้านบน ข้างช่องที่อยู่'));
      else { ol.appendChild(step('share','Tap the Share button at the bottom of Safari.','แตะปุ่ม แชร์ ด้านล่างของ Safari'));
        ol.appendChild(el('li','isnote','New iPhones: tap ⋯ at the bottom right first, then Share.')); }
      ol.appendChild(step('add','Scroll down and tap "Add to Home Screen". You may need to tap "View More" first.','เลื่อนลงแล้วแตะ เพิ่มไปยังหน้าจอโฮม'));
      ol.appendChild(step('ok','Tap Add. Open Phuket King from your home screen from now on.','แตะ เพิ่ม แล้วเปิดแอปจากหน้าจอโฮม'));
      if(!crios&&!edgios&&!fxios){ var arrow=el('div','isarrow','↓'); arrow.setAttribute('aria-hidden','true'); sheet.appendChild(arrow); }
    } else if(android){
      ol.appendChild(step('dots','Tap ⋮ at the top right of '+(samsung?'Samsung Internet (or ≡ at the bottom)':'Chrome')+'.','แตะ ⋮ มุมขวาบน'));
      ol.appendChild(step('add','Tap "Install app" or "Add to Home screen".','แตะ ติดตั้งแอป หรือ เพิ่มไปยังหน้าจอหลัก'));
      ol.appendChild(step('ok','Tap Install. Open Phuket King from your home screen from now on.','แตะ ติดตั้ง แล้วเปิดแอปจากหน้าจอหลัก'));
    } else {
      ol.appendChild(step('add','On a computer, use the install icon at the right of the address bar. On your phone, open this page and tap Install.','บนคอมพิวเตอร์ ใช้ไอคอนติดตั้งในช่องที่อยู่'));
    }
    box.appendChild(ol); if(acts.childNodes.length) box.appendChild(acts);
    var done=el('button','btn','Close'); done.type='button'; done.onclick=closeSheet; var f=el('div','isacts'); f.appendChild(done); box.appendChild(f);
    sheet.appendChild(box); sheet.addEventListener('click',function(e){ if(e.target===sheet) closeSheet(); });
    document.body.appendChild(sheet); document.body.classList.add('isheet-open'); done.focus();
  }
  function show(){
    if(standalone||hidden()||bar||document.body.classList.contains('kiosk')) return;
    if(!ios&&!android&&!deferred) return;
    bar=el('div','installbar'); bar.setAttribute('role','region'); bar.setAttribute('aria-label','Install the app');
    var img=el('img','installicon'); img.src='icons/icon-192.png'; img.alt='';
    var txt=el('div','installtxt'); txt.appendChild(el('b',null,'Get the Phuket King app')); txt.appendChild(el('span',null,'ติดตั้งแอปบนมือถือ'));
    var action=el('button','btn primary small','Install'); action.type='button'; action.onclick=open;
    var close=el('button','installx','×'); close.type='button'; close.setAttribute('aria-label','Not now'); close.onclick=function(){ hideFor(7); };
    bar.appendChild(img); bar.appendChild(txt); bar.appendChild(action); bar.appendChild(close);
    document.body.appendChild(bar); document.body.classList.add('has-install');
  }
  window.pkInstall=open; window.pkCanInstall=function(){ return !standalone&&(ios||android||!!deferred); };
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(bar){ bar.remove(); bar=null; } show(); });
  window.addEventListener('appinstalled',function(){ hideFor(3650); closeSheet(); });
  window.addEventListener('load',function(){ setTimeout(show,1500); });
})();
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
