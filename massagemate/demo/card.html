<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your member card</title>
<link rel="icon" href="icons/favicon-48.png">
<!-- The member card page: add the card to Apple Wallet or Google Wallet. The link carries the card's secret token (t) and, on the shared app, the gym (g). -->
<style>
:root{--ac:#D7263D;--bg:#111;--on:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#F2F2EF;color:#141414;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:400px}
.card{background:var(--bg);color:var(--on);border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25);aspect-ratio:1.55/1;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:10px}.top img{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#fff}.top b{font-size:17px}
.lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);font-weight:700}
.pkg{font-size:22px;font-weight:700;line-height:1.2;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:12px}.row div{min-width:0}.row span{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-size:22px;margin:26px 0 6px}p{margin:0 0 16px;color:#555}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#000;color:#fff;text-decoration:none;border-radius:12px;padding:14px;font-weight:600;font-size:16px;margin-top:10px;border:0}
.btn.g{background:#fff;color:#000;border:1.5px solid #000}
.btn svg{width:22px;height:22px}
.msg{color:#555;font-size:14px;margin-top:14px}.err{color:#B3261E}
</style>
</head>
<body>
<main class="wrap" id="main"><p>Loading your card.</p></main>
<script>
(function(){
'use strict';
var SB_URL='https://phjekupadmjwzrocahiv.supabase.co';
var Q=new URLSearchParams(location.search), T=Q.get('t')||'', G=/^[a-z][a-z0-9_]{1,40}$/.test(window.MF_HOST_GYM||'')?window.MF_HOST_GYM:((Q.get('g')||'').match(/^[a-z][a-z0-9_]{1,40}$/)?Q.get('g'):'');
var FN=SB_URL+'/functions/v1/wallet?t='+encodeURIComponent(T)+(G?'&g='+G:'');
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var ua=navigator.userAgent, ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document), android=/Android/.test(ua);
var main=document.getElementById('main');
fetch(FN+'&k=info').then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'This card could not be opened.'); return j; }); }).then(function(d){
  var t=d.theme||{}, st=document.documentElement.style; if(t.accent) st.setProperty('--ac',t.accent); if(t.bg) st.setProperty('--bg',t.bg);
  var m=/^#?([0-9a-f]{6})$/i.exec(t.bg||''); if(m){ var n=parseInt(m[1],16); if((0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))>150) st.setProperty('--on','#111'); }
  document.title=d.biz+' member card';
  var apple='<a class="btn" href="'+esc(FN+'&k=apple')+'"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2.1-3.7 2.2-3.8-1.2-1.7-3-2-3.7-2-1.6-.2-3.1.9-3.9.9s-2-.9-3.4-.9C5.9 6.9 4.2 8 3.3 9.6c-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.4 2.7 1.4-.1 1.9-.9 3.5-.9s2.1.9 3.5.9c1.5 0 2.4-1.3 3.3-2.6 1-1.5 1.5-3 1.5-3.1-.1 0-2.9-1.1-3-4.3zM13.8 5.1c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z"/></svg>Add to Apple Wallet</a>';
  var google='<a class="btn g" href="'+esc(FN+'&k=google')+'"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.2 1.1 4.6L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>Add to Google Wallet</a>';
  var btns=(d.apple&&!android?apple:'')+(d.google&&!ios?google:'');
  if(!btns) btns=(d.apple?apple:'')+(d.google?google:'');
  main.innerHTML='<div class="card"><div class="top">'+(d.icon?'<img src="'+esc(d.icon)+'" alt="">':'')+'<b>'+esc(d.biz)+'</b></div>'+
    '<div><div class="lab">Membership</div><div class="pkg">'+esc(d.pkg)+'</div></div>'+
    '<div class="row"><div><div class="lab">Member</div><span>'+esc(d.name)+'</span></div><div><div class="lab">Classes left</div><span>'+esc(d.left)+'</span></div><div><div class="lab">Valid until</div><span>'+esc(d.until)+'</span></div></div></div>'+
    '<h1>Your member card</h1><p>Add it to your phone and show it at the front desk to check in. It updates by itself when you buy a package or use a class.</p>'+
    (btns||'<p class="msg">Wallet cards are not switched on yet. Ask at the front desk.</p>')+
    '<p class="msg">Keep this link to yourself: it is your card.</p>';
}).catch(function(e){ main.innerHTML='<h1>Card not found</h1><p class="err">'+esc(e.message)+'</p>'; });
})();
</script>
</body>
</html>
