<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Train with us</title>
<meta name="description" content="Classes, timetable, coaches and prices. Book a free trial or join online.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- A fast two page website for a gym: Home and Prices. Everything comes from the app: Settings, Website, Your gym website
     for the words, photos and contact details; Classes, Packages and Staff for the timetable, prices and coaches. -->
<style>
:root{--ac:#D7263D;--on:#fff;--bg:#121212;--bg2:#1B1B1B;--card:#202020;--ink:#F4F4F1;--soft:#B8B8B2;--line:#2E2E2E}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:Anton,'Arial Narrow',Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:1;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:4px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0;flex-shrink:1}
.brand img{height:34px;width:auto;max-width:170px;object-fit:contain}
.brand b{font-family:Anton,sans-serif;font-weight:400;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{margin-left:auto;display:flex;align-items:center;gap:4px}
nav a{text-decoration:none;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px;color:var(--soft);white-space:nowrap}
nav a.on{color:var(--ink);background:var(--card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px Inter,sans-serif;text-decoration:none;border:2px solid var(--ac);background:var(--ac);color:var(--on);border-radius:99px;padding:12px 22px;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:13px}
nav .btn{margin-left:6px}
@media(max-width:640px){nav a:not(.btn){display:none}nav a.keep{display:inline-flex}.bar{height:58px}}
.hero{position:relative;min-height:min(86vh,760px);display:flex;align-items:flex-end;background:#000 center/cover no-repeat;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.35) 45%,var(--bg) 100%)}
.hero .wrap{position:relative;z-index:1;padding-top:90px;padding-bottom:48px;width:100%}
.hero .eyebrow{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.hero h1{font-size:clamp(46px,9vw,108px);max-width:14ch}
.hero h1 em{font-style:normal;color:var(--ac)}
.hero p{font-size:clamp(17px,2.2vw,20px);max-width:44ch;color:#E6E6E1;margin:18px 0 26px}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:-1px}
.facts div{background:var(--bg2);padding:18px}
.facts b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:34px;line-height:1;color:var(--ac)}
.facts span{font-size:14px;color:var(--soft)}
section.band{padding:72px 0}
section.band.alt{background:var(--bg2)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:26px}
.head h2{font-size:clamp(36px,6vw,64px)}
.head p{color:var(--soft);margin:8px 0 0;max-width:56ch}
.kicker{display:block;font:700 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.about p{color:#DADAD4;font-size:17px}
.about .ph{border-radius:20px;overflow:hidden;aspect-ratio:4/5;background:var(--card) center/cover}
.points{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px}
.points li{display:flex;gap:12px;align-items:flex-start}
.points li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;background:var(--ac);transform:rotate(45deg)}
@media(max-width:820px){.about{grid-template-columns:1fr}.about .ph{aspect-ratio:16/10}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips button{font:600 14px Inter,sans-serif;border:1.5px solid var(--line);background:transparent;color:var(--soft);border-radius:99px;padding:8px 14px;cursor:pointer}
.chips button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.day h3{font-size:20px;margin-bottom:10px}
.day.today{border-color:var(--ac)}
.day.today h3::after{content:" today";font:700 11px Inter,sans-serif;color:var(--ac);letter-spacing:.08em;vertical-align:middle}
.cls{padding:10px 0;border-top:1px solid var(--line)}
.cls:first-of-type{border-top:0;padding-top:0}
.cls time{display:block;font-weight:700;font-size:14px;color:var(--ac);font-variant-numeric:tabular-nums}
.cls b{display:block;font-size:15px;line-height:1.3;margin:2px 0}
.cls span{font-size:13px;color:var(--soft)}
.none{color:var(--soft);font-size:14px}
@media(max-width:980px){.week{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.coaches{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.coach{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.coach .ph{aspect-ratio:1/1;background:linear-gradient(135deg,var(--card),#333) center/cover;display:flex;align-items:center;justify-content:center;font:400 64px Anton,sans-serif;color:var(--ac)}
.coach .in{padding:16px}
.coach h3{font-size:26px}
.coach .t{display:block;color:var(--ac);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}
.coach p{margin:0;color:var(--soft);font-size:15px}
.find{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.find .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.find h3{font-size:22px;margin-bottom:10px}
.find p{margin:0 0 6px;color:#DADAD4}
.find a{color:var(--ink)}
.cta-band{background:var(--ac);color:var(--on);border-radius:24px;padding:40px 28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cta-band h2{font-size:clamp(34px,5vw,56px)}
.cta-band p{margin:8px 0 0;opacity:.85;max-width:50ch}
.cta-band .btn{background:var(--on);color:var(--ac);border-color:var(--on)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.plan{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column}
.plan.top{border-color:var(--ac)}
.plan .badge{position:absolute;top:-12px;left:20px;background:var(--ac);color:var(--on);font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:4px 10px}
.plan h3{font-size:26px}
.plan .price{display:flex;align-items:baseline;gap:6px;margin:14px 0 4px}
.plan .price b{font:400 52px Anton,sans-serif;line-height:1}
.plan .price span{color:var(--soft)}
.plan .was{color:var(--soft);text-decoration:line-through;font-size:15px}
.plan ul{list-style:none;padding:0;margin:14px 0 20px;display:grid;gap:8px;flex:1}
.plan li{display:flex;gap:10px;font-size:15px;color:#DADAD4}
.plan li::before{content:"";flex:none;width:8px;height:8px;margin-top:8px;background:var(--ac);transform:rotate(45deg)}
.plan .btn{width:100%}
.grp{margin:34px 0 14px;font-size:28px}
.grp:first-child{margin-top:0}
.trial{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:start}
@media(max-width:820px){.trial{grid-template-columns:1fr}}
form.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:16px Inter,sans-serif;width:100%;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.msg{font-size:14px;min-height:1.4em;color:var(--soft)}
.msg.err{color:#FF7A7A}
.done{background:var(--card);border:1.5px solid var(--ac);border-radius:20px;padding:26px}
.done h3{font-size:30px;margin-bottom:8px}
.faq details{border-top:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";color:var(--ac);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--soft);margin:10px 0 0}
footer{border-top:1px solid var(--line);padding:34px 0 calc(34px + env(safe-area-inset-bottom));color:var(--soft);font-size:14px}
footer .row{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:center}
footer a{color:var(--soft)}
.dock{display:none}
@media(max-width:640px){.dock{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}.dock .btn{flex:1;padding:11px 10px;font-size:14px}footer{padding-bottom:96px}}
.load{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.light{--bg:#F6F6F2;--bg2:#ECECE6;--card:#fff;--ink:#141414;--soft:#5F5F5A;--line:#DEDED6}
.light .hero p{color:#E6E6E1}.light .about p,.light .find p,.light .plan li{color:#333}
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="?" id="brand"><b>Loading</b></a>
  <nav id="nav" aria-label="Main"></nav>
</div></header>
<main id="main"><div class="load">Loading</div></main>
<footer><div class="wrap row" id="foot"></div></footer>
<div class="dock" id="dock"></div>
<script>
(function(){
'use strict';
var SB_URL='https://bnglnfdgptvnmugntiom.supabase.co', SB_KEY='sb_publishable_I2cEA2hEPelGTNMwf2zWwA_98_mxHT1';
var Q=new URLSearchParams(location.search), G=(Q.get('g')||'').match(/^[a-z][a-z0-9_]{1,40}$/)?Q.get('g'):'', PAGE=Q.get('p')==='prices'?'prices':'home';
var D=null, FILTER='', $=function(id){ return document.getElementById(id); };
var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
var CURS={THB:'฿',GBP:'£',USD:'$',EUR:'€',AUD:'A$',NZD:'NZ$',CAD:'C$',SGD:'S$',HKD:'HK$',JPY:'¥',INR:'₹',AED:'AED ',MYR:'RM ',PHP:'₱',IDR:'Rp ',VND:'₫',KRW:'₩'};

function rpc(fn,args){ var hd={'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}; if(G){ hd['Content-Profile']='g_'+G; hd['Accept-Profile']='g_'+G; }
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:hd,body:JSON.stringify(args||{})})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error((j&&j.message)||'Something went wrong. Please try again.'); return j; }); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function site(){ return (D&&D.site)||{}; }
function cur(){ var c=((D&&D.region)||{}).cur||'THB'; return c; }
function money(n){ var c=cur(), s=CURS[c], v=Number(n||0); if(!v) return 'Free';
  var t=v.toLocaleString('en-GB',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2}); return s?(s.length>1&&/ $/.test(s)?s+t:s+t):t+' '+c; }
function tz(){ return ((D&&D.region)||{}).tz||'Asia/Bangkok'; }
function todayIdx(){ var w=new Date().toLocaleDateString('en-GB',{weekday:'long',timeZone:tz()}); return DAYS.indexOf(w); }
function paras(t){ return String(t||'').split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean).map(function(p){ return '<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'; }).join(''); }
function hi(t){ return esc(t).replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
function app(){ return G?'../app/?g='+encodeURIComponent(G):'./'; }
function link(p,hash){ var q=[]; if(G) q.push('g='+encodeURIComponent(G)); if(p==='prices') q.push('p=prices'); return '?'+q.join('&')+(hash?'#'+hash:''); }
function wa(){ var w=String(site().whatsapp||'').replace(/\D/g,''); return w?'https://wa.me/'+w:''; }
function mapUrl(){ return site().map_url||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(D.name+' '+(site().address||''))); }
function trialOn(){ return D.trial!==false; }

function theme(){ var t=D.theme||{}, r=document.documentElement.style, ac=t.accent||'#D7263D', bg=t.bg||'#121212';
  r.setProperty('--ac',ac);
  // dark text on light accents (lime, yellow), white text on dark ones
  var m=/^#?([0-9a-f]{6})$/i.exec(ac); if(m){ var n=parseInt(m[1],16), L=(0.299*(n>>16)+0.587*(n>>8&255)+0.114*(n&255))/255; r.setProperty('--on',L>0.6?'#111':'#fff'); }
  var b=/^#?([0-9a-f]{6})$/i.exec(bg); if(b){ var k=parseInt(b[1],16), Lb=(0.299*(k>>16)+0.587*(k>>8&255)+0.114*(k&255))/255;
    if(Lb>0.6) document.body.classList.add('light'); else { r.setProperty('--bg',bg); } } }

function header(){ var s=site();
  $('brand').innerHTML=(s.logo?'<img src="'+esc(s.logo)+'" alt="'+esc(D.name)+'">':'<b>'+esc(D.name)+'</b>');
  $('brand').href=link('home');
  $('nav').innerHTML='<a href="'+link('home')+'"'+(PAGE==='home'?' class="on"':'')+'>Home</a><a href="'+link('home','timetable')+'">Timetable</a><a href="'+link('home','coaches')+'">Coaches</a>'+
    '<a class="keep" href="'+link('prices')+'"'+(PAGE==='prices'?' class="on keep"':'')+'>Prices</a>'+
    '<a class="btn sm" href="'+(trialOn()?link('prices','trial'):link('prices'))+'">'+(trialOn()?'Free trial':'Join')+'</a>';
  document.title=D.name+(PAGE==='prices'?' | Prices and free trial':(s.tagline?' | '+s.tagline:''));
  var dsc=document.querySelector('meta[name=description]'); if(dsc) dsc.setAttribute('content',s.about?String(s.about).slice(0,155):D.name+': classes, timetable, coaches and prices.');
  $('dock').innerHTML='<a class="btn ghost" href="'+link('home','timetable')+'">Timetable</a><a class="btn" href="'+(trialOn()?link('prices','trial'):link('prices'))+'">'+(trialOn()?'Free trial':'Prices')+'</a>'; }

function footer(){ var s=site(), soc=[];
  if(s.instagram) soc.push('<a href="https://www.instagram.com/'+esc(String(s.instagram).replace(/^@/,''))+'" target="_blank" rel="noopener">Instagram</a>');
  if(s.facebook) soc.push('<a href="'+esc(/^https?:/.test(s.facebook)?s.facebook:'https://www.facebook.com/'+s.facebook)+'" target="_blank" rel="noopener">Facebook</a>');
  if(s.tiktok) soc.push('<a href="https://www.tiktok.com/@'+esc(String(s.tiktok).replace(/^@/,''))+'" target="_blank" rel="noopener">TikTok</a>');
  if(wa()) soc.push('<a href="'+wa()+'" target="_blank" rel="noopener">WhatsApp</a>');
  $('foot').innerHTML='<span>© '+new Date().getFullYear()+' '+esc(D.name)+(s.address?', '+esc(s.address):'')+'</span><span style="display:flex;gap:16px;flex-wrap:wrap">'+soc.join('')+'<a href="'+app()+'">Members app</a></span>'; }

function facts(){ var c=D.classes||[], disc=[], days={}; c.forEach(function(k){ days[k.day]=1; if(k.discipline&&disc.indexOf(k.discipline)<0) disc.push(k.discipline); });
  var low=(D.packages||[]).filter(function(p){ return p.price>0; }).map(function(p){ return p.price; }).sort(function(a,b){ return a-b; })[0];
  var f=[[c.length,'classes every week'],[Object.keys(days).length,'days a week open'],[(D.coaches||[]).length,'coaches']];
  if(low) f.push([money(low),'memberships from']); else if(disc.length) f.push([disc.length,'styles to train']);
  return '<div class="facts">'+f.filter(function(x){ return x[0]; }).map(function(x){ return '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join('')+'</div>'; }

function timetable(){ var c=(D.classes||[]).filter(function(k){ return !FILTER||k.discipline===FILTER; }), t=todayIdx(), disc=[];
  (D.classes||[]).forEach(function(k){ if(k.discipline&&disc.indexOf(k.discipline)<0) disc.push(k.discipline); });
  var chips=disc.length>1?'<div class="chips" id="chips">'+['All'].concat(disc).map(function(d){ var v=d==='All'?'':d; return '<button type="button" data-f="'+esc(v)+'" class="'+(FILTER===v?'on':'')+'">'+esc(d)+'</button>'; }).join('')+'</div>':'';
  var order=[0,1,2,3,4,5,6];
  return chips+'<div class="week">'+order.map(function(d){ var list=c.filter(function(k){ return k.day===d; });
    return '<div class="day'+(d===t?' today':'')+'"><h3>'+DAYS[d]+'</h3>'+(list.length?list.map(function(k){
      return '<div class="cls"><time>'+esc(k.time)+(k.end?' to '+esc(k.end):'')+'</time><b>'+esc(k.title)+'</b>'+(k.coach?'<span>'+esc(k.coach)+'</span>':'')+'</div>'; }).join(''):'<p class="none">No classes</p>')+'</div>'; }).join('')+'</div>'; }

function home(){ var s=site(), ph=(s.photos||[]).filter(Boolean);
  var h='<section class="hero" style="background-image:url(\''+esc(s.hero||ph[0]||'')+'\')"><div class="wrap">'+
    (s.eyebrow||s.area?'<span class="eyebrow">'+esc(s.eyebrow||s.area)+'</span>':'')+
    '<h1>'+hi(s.headline||D.name)+'</h1>'+(s.tagline?'<p>'+esc(s.tagline)+'</p>':'')+
    '<div class="cta">'+(trialOn()?'<a class="btn" href="'+link('prices','trial')+'">Book a free trial</a>':'')+'<a class="btn ghost" href="'+link('prices')+'">See prices</a></div>'+
    '</div></section><div class="wrap">'+facts()+'</div>';
  if(s.about||(s.points||[]).length) h+='<section class="band"><div class="wrap about"><div><span class="kicker">About us</span><h2 style="font-size:clamp(36px,6vw,60px);margin-bottom:18px">'+hi(s.about_title||'More than a gym')+'</h2>'+paras(s.about)+
    ((s.points||[]).length?'<ul class="points">'+s.points.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('')+'</ul>':'')+'</div>'+
    '<div class="ph" style="background-image:url(\''+esc(s.about_photo||ph[1]||s.hero||'')+'\')" role="img" aria-label="Training at '+esc(D.name)+'"></div></div></section>';
  h+='<section class="band alt" id="timetable"><div class="wrap"><div class="head"><div><span class="kicker">Every week</span><h2>Timetable</h2><p>'+esc(s.timetable_note||'Turn up 10 minutes early for your first class. Beginners are welcome in every class marked beginner friendly.')+'</p></div>'+
    (trialOn()?'<a class="btn" href="'+link('prices','trial')+'">Try a class free</a>':'')+'</div><div id="tt">'+timetable()+'</div></div></section>';
  if((D.coaches||[]).length) h+='<section class="band" id="coaches"><div class="wrap"><div class="head"><div><span class="kicker">The team</span><h2>Your coaches</h2></div></div><div class="coaches">'+
    D.coaches.map(function(c){ return '<div class="coach"><div class="ph"'+(c.photo?' style="background-image:url(\''+esc(c.photo)+'\')"':'')+'>'+(c.photo?'':esc(String(c.name||'?').split(' ').map(function(w){ return w.charAt(0); }).join('').slice(0,2)))+'</div>'+
      '<div class="in"><h3>'+esc(c.name)+'</h3>'+(c.title?'<span class="t">'+esc(c.title)+'</span>':'')+(c.about?'<p>'+esc(c.about)+'</p>':'')+'</div></div>'; }).join('')+'</div></div></section>';
  h+=findUs()+'<section class="band" style="padding-top:0"><div class="wrap"><div class="cta-band"><div><h2>'+hi(s.cta_title||'Your first class is on us')+'</h2><p>'+esc(s.cta_text||'No experience needed. Come and try a class, meet the coaches and see if it is for you.')+'</p></div>'+
    '<a class="btn" href="'+(trialOn()?link('prices','trial'):link('prices'))+'">'+(trialOn()?'Book a free trial':'See prices')+'</a></div></div></section>';
  return h; }

function findUs(){ var s=site(); if(!s.address&&!s.hours&&!s.phone&&!s.email) return '';
  return '<section class="band alt"><div class="wrap"><div class="head"><div><span class="kicker">Come and train</span><h2>Find us</h2></div></div><div class="find">'+
    (s.address?'<div class="box"><h3>Where</h3><p>'+esc(s.address).replace(/,\s*/g,'<br>')+'</p><p style="margin-top:10px"><a href="'+esc(mapUrl())+'" target="_blank" rel="noopener">Open in Google Maps</a></p></div>':'')+
    (s.hours?'<div class="box"><h3>When</h3><p>'+esc(s.hours).replace(/\n/g,'<br>')+'</p><p style="margin-top:10px"><a href="'+link('home','timetable')+'">See the timetable</a></p></div>':'')+
    (s.phone||s.email||wa()?'<div class="box"><h3>Talk to us</h3>'+(s.phone?'<p><a href="tel:'+esc(String(s.phone).replace(/[^\d+]/g,''))+'">'+esc(s.phone)+'</a></p>':'')+(s.email?'<p><a href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a></p>':'')+(wa()?'<p><a href="'+wa()+'" target="_blank" rel="noopener">WhatsApp us</a></p>':'')+'</div>':'')+
    '</div></div></section>'; }

function planLines(p){ var l=[];
  if(p.week) l.push('Up to '+p.week+' class'+(p.week===1?'':'es')+' a week'); else if(p.visits) l.push(p.visits+' class'+(p.visits===1?'':'es'));
  if(p.days) l.push(p.days===30||p.days===31?'Monthly':p.days===7?'For a week':p.days===365?'For a year':'For '+p.days+' days');
  if((p.covers||[]).length) l.push(p.covers.join(', '));
  String(p.notes||'').replace(/Website price [\d.,]+\.?/i,'').split(/\.\s+/).map(function(x){ return x.trim().replace(/\.$/,''); }).filter(Boolean).forEach(function(x){ l.push(x); });
  return l; }
function per(p){ return p.days>=28&&p.days<=31?'a month':p.days===7?'a week':p.days===365?'a year':''; }
function prices(){ var s=site(), pk=(D.packages||[]).filter(function(p){ return p.price>0||(p.tiers||[]).length; }), free=(D.packages||[]).filter(function(p){ return !p.price&&!(p.tiers||[]).length; });
  var pt=pk.filter(function(p){ return (p.covers||[]).indexOf('Privates')>=0; }), mem=pk.filter(function(p){ return pt.indexOf(p)<0; });
  var top=mem.slice().sort(function(a,b){ return b.price-a.price; })[0];
  function card(p){ var lines=planLines(p), lowT=(p.tiers||[]).length?Math.min.apply(null,p.tiers.map(function(t){ return Number(t.price)||0; })):null;
    return '<div class="plan'+(p===top?' top':'')+'">'+(p.badge?'<span class="badge">'+esc(p.badge)+'</span>':p===top?'<span class="badge">Most training</span>':'')+
      '<h3>'+esc(String(p.name).replace(/,?\s*monthly$/i,''))+'</h3><div class="price"><b>'+esc(lowT!=null?money(lowT):money(p.price))+'</b><span>'+(lowT!=null?'from':esc(per(p)))+'</span></div>'+
      (p.was?'<span class="was">'+esc(money(p.was))+'</span>':'')+
      '<ul>'+lines.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>'+
      '<a class="btn" href="'+app()+'#buy='+esc(p.id)+'">Join online</a></div>'; }
  var h='<section class="band" style="padding-bottom:30px"><div class="wrap"><div class="head"><div><span class="kicker">Prices</span><h2>'+hi(s.prices_title||'Memberships')+'</h2><p>'+esc(s.prices_note||'Pick your membership and join online in a minute. You get the members app with your timetable, check in and payments.')+'</p></div></div>'+
    (mem.length?'<div class="plans">'+mem.map(card).join('')+'</div>':'<p class="none">Prices are coming soon. Get in touch and we will tell you.</p>')+
    (pt.length?'<h3 class="grp">Personal training</h3><div class="plans">'+pt.map(card).join('')+'</div>':'')+'</div></section>';
  if(trialOn()) h+='<section class="band alt" id="trial"><div class="wrap trial"><div><span class="kicker">New here?</span><h2 style="font-size:clamp(36px,6vw,60px)">'+hi(s.trial_title||'Book your *free* trial')+'</h2>'+
    paras(s.trial_text||(free[0]&&free[0].notes)||'Pick the class you want to try and we will see you there. Bring water and comfortable clothes. We have gloves to borrow.')+
    '<ul class="points"><li>No experience needed</li><li>Meet the coaches</li><li>No card, nothing to pay</li></ul></div><div id="tform">'+trialForm()+'</div></div></section>';
  h+=faq()+findUs();
  return h; }

function trialForm(){ var c=D.classes||[], t=todayIdx(), opts=[];
  for(var i=0;i<7;i++){ var d=(t+i)%7, dn=i===0?'Today':i===1?'Tomorrow':DAYS[d]; c.filter(function(k){ return k.day===d; }).forEach(function(k){ opts.push(dn+' '+k.time+', '+k.title); }); }
  return '<form class="card" id="tf" novalidate><div class="two"><label>Your name<input name="name" autocomplete="name" required></label><label>Phone<input name="phone" type="tel" autocomplete="tel"></label></div>'+
    '<label>Email<input name="email" type="email" autocomplete="email" required></label>'+
    (opts.length?'<label>Which class?<select name="class"><option value="">I am not sure yet, help me choose</option>'+opts.map(function(o){ return '<option>'+esc(o)+'</option>'; }).join('')+'</select></label>':'')+
    '<label>Anything we should know? <span style="font-weight:400;color:var(--soft)">(optional)</span><textarea name="message" placeholder="For example: my son is 9 and has never trained."></textarea></label>'+
    '<button class="btn" type="submit">Book my free trial</button><p class="msg" id="tmsg" role="status"></p></form>'; }

function faq(){ var q=Array.isArray(site().faq)&&site().faq.length?site().faq:[
    ['Do I need experience?','No. Most people start as complete beginners. The coaches show you everything step by step and you train at your own pace.'],
    ['What should I bring?','Comfortable sports clothes, water and a towel. Gloves and pads can be borrowed for your first classes.'],
    ['How do I join?','Tap Join online on a membership. You make your account in the members app and pay, then you are ready to book and check in.'],
    ['Can I stop my membership?','Yes. Talk to us at the gym or message us and we will sort it out.']];
  return '<section class="band faq"><div class="wrap" style="max-width:820px"><div class="head"><div><span class="kicker">Questions</span><h2>Good to know</h2></div></div>'+
    q.map(function(x){ var a=Array.isArray(x)?x:[x.q,x.a]; return '<details><summary>'+esc(a[0])+'</summary><p>'+esc(a[1])+'</p></details>'; }).join('')+'</div></section>'; }

function draw(){
  theme(); header(); footer();
  $('main').innerHTML=PAGE==='prices'?prices():home();
  if(location.hash){ var el=document.getElementById(location.hash.slice(1)); if(el) setTimeout(function(){ el.scrollIntoView(); },60); }
}
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('#chips button'); if(!b) return; FILTER=b.getAttribute('data-f'); $('tt').innerHTML=timetable(); });
document.addEventListener('submit',function(e){ if(e.target.id!=='tf') return; e.preventDefault(); var f=e.target, m=$('tmsg'), v={};
  ['name','email','phone','class','message'].forEach(function(k){ if(f[k]) v[k]=f[k].value.trim(); });
  if(!v.name){ m.className='msg err'; m.textContent='Please add your name.'; f.name.focus(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)){ m.className='msg err'; m.textContent='Please check your email address.'; f.email.focus(); return; }
  var btn=f.querySelector('button'); btn.disabled=true; m.className='msg'; m.textContent='Sending';
  rpc('gym_web_trial',{p:v}).then(function(){
    $('tform').innerHTML='<div class="done" role="status"><h3>You are booked in</h3><p>Thanks '+esc(v.name.split(' ')[0])+'. '+(v['class']?'We will see you at <b>'+esc(v['class'])+'</b>. ':'')+'We will get in touch by email'+(v.phone?' or phone':'')+' to confirm.</p><p style="margin-top:14px"><a href="'+link('home','timetable')+'">See the timetable</a></p></div>'; })
    .catch(function(er){ btn.disabled=false; m.className='msg err'; m.textContent=er.message; }); });

rpc('gym_web').then(function(d){ D=d||{};
  if(D.off){ $('main').innerHTML='<div class="load">This website is not on yet.</div>'; $('brand').innerHTML='<b>&nbsp;</b>'; return; }
  draw();
}).catch(function(e){ $('main').innerHTML='<div class="load">The website could not load. '+esc(e.message)+' Reload the page to try again.</div>'; });
})();
</script>
</body>
</html>
