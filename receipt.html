<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Receipt</title>
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#171B23;--muted:#666;--line:#e8e6e0;--accent:#171B23}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1c1d20;--ink:#f1efe9;--muted:#a9a6a0;--line:#2c2d31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 40px}
.r{max-width:460px;margin:0 auto;background:var(--card);border-radius:12px;padding:24px;border-top:6px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{margin:0;font-size:21px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.meta{margin:18px 0 10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
td{padding:7px 0;vertical-align:top}td.n{text-align:right;white-space:nowrap;padding-left:12px}
tr.sep td{border-top:1px solid var(--line);padding:0}
tr.b td{font-weight:700}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#e3f3e8;color:#1d6b35}
.chip.warn{background:#fdf0dc;color:#8a5a00}.chip.bad{background:#fde3e3;color:#a11}
.foot{margin-top:18px;font-size:14px}
.acts{max-width:460px;margin:14px auto 0;display:flex;gap:10px;justify-content:center}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.err{max-width:460px;margin:40px auto;text-align:center;color:var(--muted)}
@media print{body{background:#fff;padding:0}.r{box-shadow:none;border-radius:0}.acts{display:none}}
</style>
</head>
<body>
<div id="out"><p class="err">Loading your receipt.</p></div>
<script>
(function(){
var URL_='https://jijnshwduhgegacfvpkh.supabase.co', KEY='sb_publishable_Y-ecbe3vlPAa6QipGHD1zQ_W-sh8V4i';
var PAY={cash:'Cash',qr:'PromptPay QR',card:'Card',transfer:'Bank transfer',stripe:'Card (online)',room:'Room bill',pack:'From a pack',staff:'Staff'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function thb(n){ return Math.round(Number(n)||0).toLocaleString('en-US')+' THB'; }
function day(d){ try{ return new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); }catch(e){ return d||''; } }
var out=document.getElementById('out'), t=new URLSearchParams(location.search).get('t')||'';
if(!/^[0-9a-f]{24,64}$/.test(t)){ out.innerHTML='<p class="err">This receipt link is not complete. Ask us to send it again.</p>'; return; }
fetch(URL_+'/rest/v1/rpc/receipt_view',{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify({p_token:t})})
  .then(function(r){ return r.json(); }).then(function(r){
    if(!r||!r.number){ out.innerHTML='<p class="err">Receipt not found. Ask us to send it again.</p>'; return; }
    if(/^#[0-9a-f]{6}$/i.test(r.accent||'')) document.documentElement.style.setProperty('--accent',r.accent);
    document.title='Receipt '+r.number+', '+r.business;
    var row=function(k,v,c){ return '<tr'+(c?' class="'+c+'"':'')+'><td>'+k+'</td><td class="n">'+v+'</td></tr>'; };
    var status=r.refunded?'<span class="chip bad">Refunded</span>':r.room?'<span class="chip warn">On the room bill</span>':r.owed?'<span class="chip warn">'+esc(thb(r.owed))+' to pay</span>':'<span class="chip">Paid</span>';
    out.innerHTML='<div class="r"><h1>'+esc(r.business)+'</h1>'+(r.address?'<p class="sub">'+esc(r.address)+'</p>':'')+(r.tax_id?'<p class="sub">Tax ID '+esc(r.tax_id)+'</p>':'')+
      '<div class="meta"><div><b>Receipt '+esc(r.number)+'</b><br><span class="sub">'+esc(day(r.date))+'</span>'+(r.customer?'<br>For '+esc(r.customer):'')+'</div><div>'+status+'</div></div>'+
      '<table>'+(r.lines||[]).map(function(l){ return row(esc(l.name),esc(thb(l.amount))); }).join('')+
      (r.discount?row('Discount','-'+esc(thb(r.discount))):'')+(r.fee?row('Card fee',esc(thb(r.fee))):'')+(r.tax?row('Tax',esc(thb(r.tax))):'')+
      '<tr class="sep"><td colspan="2"></td></tr>'+row('Total',esc(thb(r.total)),'b')+
      (r.payments||[]).map(function(p){ return row('Paid'+(PAY[p.method]?', '+PAY[p.method]:'')+(p.day&&p.day!==r.date?', '+esc(day(p.day)):''),esc(thb(p.amount))); }).join('')+
      (r.owed&&!r.room?row('Still to pay',esc(thb(r.owed)),'b'):'')+'</table>'+
      '<p class="foot">'+esc(r.footer||'Thank you.')+'</p>'+(r.email||r.whatsapp?'<p class="sub">'+[r.email?esc(r.email):'',r.whatsapp?'WhatsApp +'+esc(String(r.whatsapp).replace(/^\+/,'')):''].filter(Boolean).join(' · ')+'</p>':'')+'</div>'+
      '<div class="acts"><button type="button" id="pr">Save or print</button></div>';
    document.getElementById('pr').onclick=function(){ window.print(); };
  }).catch(function(){ out.innerHTML='<p class="err">The receipt could not load. Check the internet and try again.</p>'; });
})();
</script>
</body>
</html>
