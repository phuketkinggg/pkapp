<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://server.arcgisonline.com https://*.basemaps.cartocdn.com; connect-src 'self'; object-src 'none'; base-uri 'self'">
<title>Around Pangea | Phuket King</title>
<meta name="description" content="Map of Phuket King Muay Thai and Pangea Resort in Kathu, Phuket: the gym, spa, rooms, Pangea Cafe, nearby Lotus's, ATM and 7-Eleven, and the 4.4 km PK Run Route.">
<link rel="canonical" href="https://www.phuketking.com/around-pangea">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{--ink:#14201c;--bg:#fff;--muted:#5b6762;--line:#e3e7e5;--red:#c8102e;--lake:#0f6e7a;--gold:#e0a526;--green:#2f7d4f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:360px minmax(0,1fr);height:100%}
#map{height:100%;background:#1c2a26}
aside{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);overflow:hidden}
header{padding:18px 20px 12px;padding-top:max(18px,env(safe-area-inset-top));background:var(--ink);color:#fff}
header h1{font:600 26px/1.05 Oswald,sans-serif;margin:0;letter-spacing:.5px}
header p{margin:6px 0 0;color:#c9d3cf;font-size:14px}
header a{color:#fff;font-size:13px;text-decoration:none;opacity:.8;display:inline-block;margin-bottom:8px}
header a:hover{opacity:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font:500 14px Inter,sans-serif;cursor:pointer;min-height:40px;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible,.item:focus-visible,.ctl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#list{overflow-y:auto;flex:1;padding:6px 0 max(10px,env(safe-area-inset-bottom))}
.grp{font:600 13px Oswald,sans-serif;letter-spacing:.6px;color:var(--muted);padding:14px 20px 4px;text-transform:uppercase}
.item{display:flex;gap:12px;align-items:center;width:100%;padding:10px 20px;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;min-height:56px}
.item:hover{background:#f3f6f5}
.dot{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff}
.dot svg{width:18px;height:18px}
.item b{display:block;font-weight:600}
.item small{color:var(--muted);font-size:13px}
.item .d{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:13px;text-align:right}
.pin{width:38px;height:38px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.pin svg{transform:rotate(45deg);width:18px;height:18px;color:#fff}
.leaflet-popup-content{margin:14px 16px;font:14px/1.45 Inter,sans-serif}
.pop h3{margin:0 0 2px;font:600 18px Oswald,sans-serif}
.pop p{margin:0 0 10px;color:var(--muted)}
.pop a{display:inline-block;background:var(--red);color:#fff!important;text-decoration:none;padding:9px 14px;border-radius:8px;font-weight:600}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl button{width:44px;height:44px;border-radius:10px;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;font:600 12px Inter,sans-serif;color:var(--ink)}
.toggle{position:absolute;z-index:500;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3);overflow:hidden}
.toggle button{border:0;background:none;padding:10px 14px;font:600 13px Inter,sans-serif;cursor:pointer;min-height:44px;color:var(--ink)}
.toggle button[aria-pressed=true]{background:var(--ink);color:#fff}
#mapwrap{position:relative;height:100%}
@media(max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:58vh minmax(0,1fr)}
 aside{order:2;border-right:0;border-top:1px solid var(--line)}
 header{padding-top:14px}header h1{font-size:22px}
}
</style>
<meta property="og:title" content="Around Pangea">
<meta property="og:description" content="Map of Phuket King Muay Thai and Pangea Resort in Kathu, Phuket: the gym, spa, rooms, Pangea Cafe, nearby Lotus's, ATM and 7-Eleven, and the 4.4 km PK Run Route.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Phuket King Muay Thai">
<meta property="og:locale" content="en_GB">

<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "BreadcrumbList", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.phuketking.com/"}, {"@type": "ListItem", "position": 2, "name": "Map of the area", "item": "https://www.phuketking.com/around-pangea"}]}</script>

<body>
<div id="app">
 <aside>
  <header>
   <a href="/">&larr; Phuket King</a>
   <h1>Around Pangea</h1>
   <p>Phuket King Muay Thai and Pangea Resort, Kathu. Tap a place to find it.</p>
  </header>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
 </aside>
 <div id="mapwrap">
  <div id="map" role="application" aria-label="Map of Phuket King and Pangea Resort"></div>
  <div class="toggle"><button id="bSat" aria-pressed="true">Satellite</button><button id="bMap" aria-pressed="false">Map</button></div>
 </div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
{
const IC={
 bed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.6"/></svg>',
 fist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 9a3 3 0 0 1 3-3h6a4 4 0 0 1 4 4v3a6 6 0 0 1-6 6h-2a5 5 0 0 1-5-5z"/><path d="M6 12h7M11 6v6"/></svg>',
 drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
 bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>',
 cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h10L20 8H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>',
 card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h3"/></svg>',
 shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 10v10h16V10M3 10l2-6h14l2 6zM10 20v-5h4v5"/></svg>',
 cup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/></svg>',
 run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="1.8"/><path d="M6 20l3.5-5 3 2 1.5-5 3 3h3M9 11l3-3 3 1"/></svg>'
};
const CAT={
 stay:{name:'Pangea Resort',col:'#0f6e7a'},
 pk:{name:'Phuket King',col:'#c8102e'},
 need:{name:'Essentials nearby',col:'#2f7d4f'},
 move:{name:'Get moving',col:'#e0a526'}
};
const P=[
 {id:'mg',c:'stay',ic:'bed',n:'Mango Grove',s:'Pangea garden bungalows',lat:7.914422249050827,lng:98.33777534368124},
 {id:'lv',c:'stay',ic:'bed',n:'Lake View',s:'Pangea lakeside rooms',lat:7.91433296089443,lng:98.3375394940704},
 {id:'cafe',c:'stay',ic:'cup',n:'Pangea Cafe',s:'Healthy food, no seed oils. Between Lake View and Mango Grove',lat:7.91437761,lng:98.33765742},
 {id:'gym',c:'pk',ic:'fist',n:'Phuket King Gym',s:'Main training room, rings and classes',lat:7.914724210738291,lng:98.33664924617564},
 {id:'spa',c:'pk',ic:'drop',n:'Pangea Spa',s:'Herbal sauna, steam, dry sauna, ice bath',lat:7.914797953091703,lng:98.33659761261437},
 {id:'fit',c:'pk',ic:'bell',n:'Fitness Zone',s:'Strength and conditioning area',lat:7.914740318854405,lng:98.33648755625566},
 {id:'lotus',c:'need',ic:'cart',n:"Lotus's",s:'Supermarket for groceries and everyday items',lat:7.913064249865516,lng:98.33643922269314},
 {id:'atm',c:'need',ic:'card',n:'ATM',s:'Cash machine',lat:7.913148034919369,lng:98.33659396427618},
 {id:'711',c:'need',ic:'shop',n:'7-Eleven',s:'Snacks, drinks, SIM top-ups',lat:7.913201533963395,lng:98.34184217170042}
];
const ROUTE=[[98.33649979543857,7.914633154530038],[98.33754046660604,7.913593703484125],[98.33908904827847,7.914169924936858],[98.34147444335261,7.913115990242499],[98.34419953121849,7.916668489622502],[98.34409648414587,7.917383113216077],[98.34205202293425,7.91684521318496],[98.33979415302241,7.919342560690598],[98.33866673405859,7.921398023156374],[98.33694536926133,7.921788301266556],[98.3342252806973,7.921035905598518],[98.33113675609528,7.918607897617647],[98.33110505025823,7.918222308842046],[98.33180701621572,7.918069691290719],[98.33332079627722,7.916187537902272],[98.33382184494825,7.916212639423611],[98.33531545563834,7.914892058824035],[98.33541638938019,7.913044974599339],[98.33589052169488,7.913029446331931],[98.33679059178961,7.912314590378275],[98.33742901452169,7.913456447699875],[98.33649979543857,7.914633154530038]].map(p=>[p[1],p[0]]);

const map=L.map('map',{zoomControl:false,maxZoom:20}).setView([7.9155,98.3375],17);
const sat=L.layerGroup([
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:20,attribution:'Imagery &copy; Esri, Maxar'}),
 L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:20,opacity:.8})
]).addTo(map);
const street=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxNativeZoom:20,maxZoom:20,attribution:'&copy; OpenStreetMap, &copy; CARTO'});
L.control.zoom({position:'bottomright'}).addTo(map);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=6371000,rad=x=>x*Math.PI/180;
const dist=(a,b)=>{const dLa=rad(b[0]-a[0]),dLo=rad(b[1]-a[1]);const h=Math.sin(dLa/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const GYM=[P[2].lat,P[2].lng];
const walk=m=>m<60?'Right here':Math.max(1,Math.round(m/80))+' min walk';
const fmt=m=>m<1000?Math.round(m/10)*10+' m':(m/1000).toFixed(1)+' km';
let routeLen=0;for(let i=1;i<ROUTE.length;i++)routeLen+=dist(ROUTE[i-1],ROUTE[i]);

const icon=p=>L.divIcon({className:'',iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-34],html:'<div class="pin" style="background:'+CAT[p.c].col+'">'+IC[p.ic]+'</div>'});
const dir=(lat,lng)=>'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+lat+','+lng;
const markers={},layers={};
Object.keys(CAT).forEach(k=>layers[k]=L.layerGroup().addTo(map));
P.forEach(p=>{
 const m=dist(GYM,[p.lat,p.lng]);p.m=m;
 markers[p.id]=L.marker([p.lat,p.lng],{icon:icon(p),title:p.n}).addTo(layers[p.c])
  .bindPopup('<div class="pop"><h3>'+esc(p.n)+'</h3><p>'+esc(p.s)+(p.c==='need'?'<br>'+fmt(m)+' from the gym, '+walk(m).toLowerCase():'')+'</p><a href="'+dir(p.lat,p.lng)+'" target="_blank" rel="noopener">Directions</a></div>');
});
const route=L.polyline(ROUTE,{color:'#e0a526',weight:5,opacity:.95,dashArray:'10 8'}).addTo(layers.move)
 .bindPopup('<div class="pop"><h3>PK Run Route</h3><p>'+(routeLen/1000).toFixed(1)+' km loop starting and finishing at the gym. Follow the gold dashed line.</p><a href="'+dir(GYM[0],GYM[1])+'" target="_blank" rel="noopener">Directions to start</a></div>');
L.circleMarker(GYM,{radius:7,color:'#fff',weight:3,fillColor:'#e0a526',fillOpacity:1}).addTo(layers.move);

const list=document.getElementById('list');
const row=(id,col,ic,n,s,d)=>'<button class="item" data-id="'+id+'"><span class="dot" style="background:'+col+'">'+ic+'</span><span><b>'+esc(n)+'</b><small>'+esc(s)+'</small></span><span class="d">'+esc(d)+'</span></button>';
const shown=new Set(Object.keys(CAT));
function render(){
 list.innerHTML=Object.keys(CAT).filter(k=>shown.has(k)).map(k=>{
  const items=k==='move'
   ?row('route',CAT.move.col,IC.run,'PK Run Route','Loop from the gym',(routeLen/1000).toFixed(1)+' km')
   :P.filter(p=>p.c===k).sort((a,b)=>a.m-b.m).map(p=>row(p.id,CAT[k].col,IC[p.ic],p.n,p.s,k==='need'?walk(p.m):'')).join('');
  return '<div class="grp">'+esc(CAT[k].name)+'</div>'+items;
 }).join('');
}
render();
list.addEventListener('click',e=>{
 const b=e.target.closest('.item');if(!b)return;
 const id=b.dataset.id;
 if(id==='route'){map.flyToBounds(route.getBounds(),{padding:[30,30]});route.openPopup(route.getCenter());}
 else{const mk=markers[id];map.flyTo(mk.getLatLng(),19,{duration:.8});setTimeout(()=>mk.openPopup(),850);}
 if(innerWidth<=760)document.getElementById('mapwrap').scrollIntoView({behavior:'smooth'});
});

const chips=document.getElementById('chips');
chips.innerHTML='<button class="chip" data-k="all" aria-pressed="true">All</button>'+Object.keys(CAT).map(k=>'<button class="chip" data-k="'+k+'" aria-pressed="false">'+esc(CAT[k].name)+'</button>').join('');
chips.addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 const k=b.dataset.k;shown.clear();
 if(k==='all')Object.keys(CAT).forEach(x=>shown.add(x));else shown.add(k);
 chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));
 Object.keys(CAT).forEach(x=>shown.has(x)?map.addLayer(layers[x]):map.removeLayer(layers[x]));
 render();
 const pts=[];shown.forEach(x=>layers[x].eachLayer(l=>{if(l.getLatLng)pts.push(l.getLatLng());else if(l.getLatLngs)pts.push(...l.getLatLngs())}));
 if(pts.length)map.flyToBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:19});
});

const bSat=document.getElementById('bSat'),bMap=document.getElementById('bMap');
bSat.onclick=()=>{map.removeLayer(street);map.addLayer(sat);bSat.setAttribute('aria-pressed',true);bMap.setAttribute('aria-pressed',false)};
bMap.onclick=()=>{map.removeLayer(sat);map.addLayer(street);bMap.setAttribute('aria-pressed',true);bSat.setAttribute('aria-pressed',false)};

const Loc=L.Control.extend({options:{position:'bottomright'},onAdd(){const d=L.DomUtil.create('div','ctl');d.innerHTML='<button title="Show my location" aria-label="Show my location">Me</button>';L.DomEvent.disableClickPropagation(d);d.firstChild.onclick=()=>map.locate({setView:true,maxZoom:18});return d}});
map.addControl(new Loc());
let me;map.on('locationfound',e=>{if(me)me.remove();me=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map).bindPopup('You are here').openPopup()});

const pin=location.hash.slice(1);if(markers[pin]){map.setView(markers[pin].getLatLng(),19);markers[pin].openPopup();}
}
</script>
</body>
</html>
